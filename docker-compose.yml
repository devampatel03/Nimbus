services:
  postgres:
    build:
      context: infra/docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM (vLLM, OpenAI-compatible server, this session). Requires an NVIDIA
  # GPU with the nvidia-container-toolkit installed on the Docker host --
  # see https://docs.vllm.ai/en/latest/deployment/docker.html. This repo's
  # own dev machine (as configured when this service was added) has no
  # CUDA GPU, only integrated graphics, so `docker compose up vllm` will
  # not start here; documented for GPU-equipped hosts. Standalone
  # equivalent, same effect without docker compose:
  #   vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000
  # Production should override VLLM_MODEL to the bigger Qwen3.8-27B via
  # `.env` (needs more VRAM than the Qwen2.5-7B dev default).
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  qdrant_data:
  vllm_cache:

[project]
name = "nimbus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=3,<4",
    "cryptography>=43",
    "tzdata>=2024.1",  # Asia/Kolkata for ZoneInfo on hosts without system tzdata (was transitive via apscheduler)
]

[project.optional-dependencies]
# Local Qwen3 embedder (ADR-0013). Optional: the API embedder is the fallback and
# the pre-commit/CI type-check environments do not need torch.
local-embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Optional [local-embed] extra (ADR-0013); imported lazily inside Qwen3Embedder.
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true


[project]
name = "nimbus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "langgraph>=0.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "sentence-transformers>=3.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection sentinels (Query/Path/Depends/Body/...)
# are meant to sit in argument defaults -- that's how FastAPI recognises
# them. Without this, B008 misflags every such route param as a bug.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true